plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def ortVersion = '1.20.0'

dependencies {
    // The Android app supplies onnxruntime-android (same API) at runtime.
    compileOnly "com.microsoft.onnxruntime:onnxruntime:$ortVersion"
    // sherpa-onnx Java API (downloaded by scripts/fetch_models.sh); the app bundles it
    compileOnly files("$rootDir/libs/sherpa-onnx-jvm.jar")
    testImplementation files("$rootDir/libs/sherpa-onnx-jvm.jar")
    testRuntimeOnly fileTree(dir: "$rootDir/libs/test", include: ['*.jar'])
    testImplementation "com.microsoft.onnxruntime:onnxruntime:$ortVersion"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

test {
    systemProperty 'mt.cases', (project.findProperty('mtCases') ?: '')
    systemProperty 'asr.case', (project.findProperty('asrCase') ?: '')
    systemProperty 'pron.case', (project.findProperty('pronCase') ?: '')
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
