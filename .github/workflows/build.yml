name: Build translator

# Runs on every push and can be started by hand (Actions tab -> Build translator -> Run workflow).
# Produces: FieldTranslator.apk (Android) and FieldTranslator-Windows.zip (laptop),
# published on the repo's Releases page under "latest".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-v1-${{ hashFiles('scripts/fetch_models.sh') }}

      - name: Python tools
        run: pip install onnxruntime==1.20.0 "numpy<2.3" sentencepiece==0.2.0 transformers==4.46.3 sherpa-onnx==1.13.8

      - name: Download and prepare models
        run: scripts/fetch_models.sh

      - name: Check translation quality + build reference outputs (Python)
        run: |
          python scripts/make_reference.py core/src/test/resources/tiny ru-en core/src/test/resources/tiny/reference.tsv --no-sanity
          python scripts/make_reference.py app/src/main/assets/mt/ru-en ru-en build/ref/ru-en.tsv --hf .model-cache/opus-mt-ru-en
          python scripts/make_reference.py app/src/main/assets/mt/en-ru en-ru build/ref/en-ru.tsv --hf .model-cache/opus-mt-en-ru

      - name: Check pronunciation guide (Python)
        run: python scripts/check_pronounce.py app/src/main/assets/learn/stress.tsv build/ref/pron.tsv

      - name: Check Russian speech recognition (Python)
        run: python scripts/check_asr.py app/src/main/assets/asr/ru-zipformer .model-cache/ru-zipformer/test.wav build/ref/asr-ru.txt

      - name: Check the phone code gives identical results (Java)
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon \
            "-PmtCases=$PWD/app/src/main/assets/mt/ru-en::$PWD/build/ref/ru-en.tsv;$PWD/app/src/main/assets/mt/en-ru::$PWD/build/ref/en-ru.tsv" \
            "-PasrCase=$PWD/app/src/main/assets/asr/ru-zipformer::$PWD/.model-cache/ru-zipformer/test.wav::$PWD/build/ref/asr-ru.txt" \
            "-PpronCase=$PWD/app/src/main/assets/learn/stress.tsv::$PWD/build/ref/pron.tsv" \
            "-PttsDir=$PWD/app/src/main/assets/tts/ru" \
            2>&1 | tee test.log || { grep -E "error:|FAILED|expected|Exception|What went wrong" -A2 test.log | head -40 | sed 's/^/::error::/'; exit 1; }
          grep -E "Russian ASR|cases identical|Pronunciation:|Voice" test.log | sed 's/^/::notice::/' || true

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|warning: \[|FAILED|What went wrong|Could not" -A3 build.log | head -60 | sed 's/^/::error::/'; exit 1; }

      - name: Check APK contents
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/.*\.so"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for lib in libvosk.so libonnxruntime.so libsherpa-onnx-jni.so libjnidispatch.so; do
              unzip -l "$APK" | grep -q "lib/$abi/$lib" || { echo "::error::missing $lib for $abi"; exit 1; }
            done
          done
          unzip -l "$APK" | grep -q "assets/asr/ru-zipformer/encoder.int8.onnx" || { echo "::error::Russian speech model missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/learn/learn.json" || { echo "::error::learning data missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/tts/ru/model.onnx" || { echo "::error::voice missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/tts/ru/espeak-ng-data/ru_dict" || { echo "::error::voice dictionary missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/mt/en-ru/decoder.onnx" || { echo "models missing"; exit 1; }
          cp "$APK" FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTranslator-apk
          path: FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: app/src/main/assets
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: testdata
          path: .model-cache/ru-zipformer/test.wav
          retention-days: 3

  windows:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - uses: actions/download-artifact@v4
        with:
          name: testdata
          path: testdata

      - name: Build laptop app
        shell: bash
        run: |
          pip install -r laptop/requirements.txt pyinstaller==6.11.1
          # console build with the console hidden at start: no black window for the user,
          # but stdout/stderr still work for the CI self-test
          pyinstaller --noconfirm --console --hide-console hide-early --name FieldTranslator \
            --collect-all vosk --collect-all sounddevice --collect-all sherpa_onnx --collect-binaries onnxruntime \
            --paths laptop laptop/app.py
          cp -r models dist/FieldTranslator/models
          rm -f dist/FieldTranslator/models/models_size.txt
          cp laptop/README-laptop.txt dist/FieldTranslator/README.txt

      - name: Self-test the built app
        shell: pwsh
        timeout-minutes: 8
        run: |
          cd dist/FieldTranslator
          $wav = (Resolve-Path ..\..\testdata\test.wav).Path
          $p = Start-Process -FilePath .\FieldTranslator.exe -ArgumentList '--selftest',"`"$wav`"" -PassThru -NoNewWindow `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "::error::self-test timed out" }
          $log = @()
          foreach ($f in 'selftest.txt','out.txt','err.txt') { if (Test-Path $f) { $log += Get-Content $f } }
          $log | ForEach-Object { Write-Output $_ }
          $passed = (Test-Path selftest.txt) -and (Select-String -Path selftest.txt -Pattern 'SELFTEST PASSED' -Quiet)
          Remove-Item selftest.txt,out.txt,err.txt -ErrorAction SilentlyContinue
          if (-not $passed) {
            $tail = ($log | Select-Object -Last 25) -join ' | '
            Write-Output "::error title=Windows self-test failed::$tail"
            exit 1
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FieldTranslator -DestinationPath FieldTranslator-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTranslator-windows
          path: FieldTranslator-Windows.zip

  release:
    needs: [android, windows]
    # publish the APK even if the laptop build fails
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          files="out/FieldTranslator-apk/FieldTranslator.apk"
          [ -f out/FieldTranslator-windows/FieldTranslator-Windows.zip ] && files="$files out/FieldTranslator-windows/FieldTranslator-Windows.zip"
          gh release create latest $files \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "Android: download FieldTranslator.apk on the phone and open it (allow 'install unknown apps'). Laptop: unzip FieldTranslator-Windows.zip and run FieldTranslator.exe. Both work fully offline."
