name: Build translator

# Runs on every push and can be started by hand (Actions tab -> Build translator -> Run workflow).
# Produces: FieldTranslator.apk (Android) and FieldTranslator-Windows.zip (laptop),
# published on the repo's Releases page under "latest".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-v1-${{ hashFiles('scripts/fetch_models.sh') }}

      - name: Python tools
        run: pip install onnxruntime==1.20.0 "numpy<2.3" sentencepiece==0.2.0 transformers==4.46.3 sherpa-onnx==1.13.8

      - name: Download and prepare models
        run: scripts/fetch_models.sh

      - name: Check translation quality + build reference outputs (Python)
        run: |
          python scripts/make_reference.py core/src/test/resources/tiny ru-en core/src/test/resources/tiny/reference.tsv --no-sanity
          python scripts/make_reference.py app/src/main/assets/mt/ru-en ru-en build/ref/ru-en.tsv --hf .model-cache/opus-mt-ru-en
          python scripts/make_reference.py app/src/main/assets/mt/en-ru en-ru build/ref/en-ru.tsv --hf .model-cache/opus-mt-en-ru

      - name: Check pronunciation guide (Python)
        run: python scripts/check_pronounce.py app/src/main/assets/learn/stress.tsv build/ref/pron.tsv

      - name: Check number words (Python)
        run: python scripts/check_numbers.py build/ref/numbers.tsv

      - name: Check Russian speech recognition (Python)
        run: python scripts/check_asr.py app/src/main/assets/asr/ru-zipformer .model-cache/ru-zipformer/test.wav build/ref/asr-ru.txt

      - name: Check the phone code gives identical results (Java)
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon \
            "-PmtCases=$PWD/app/src/main/assets/mt/ru-en::$PWD/build/ref/ru-en.tsv;$PWD/app/src/main/assets/mt/en-ru::$PWD/build/ref/en-ru.tsv" \
            "-PasrCase=$PWD/app/src/main/assets/asr/ru-zipformer::$PWD/.model-cache/ru-zipformer/test.wav::$PWD/build/ref/asr-ru.txt" \
            "-PpronCase=$PWD/app/src/main/assets/learn/stress.tsv::$PWD/build/ref/pron.tsv" \
            "-PttsDir=$PWD/app/src/main/assets/tts/ru" \
            "-PnumRef=$PWD/build/ref/numbers.tsv" \
            2>&1 | tee test.log || { grep -E "error:|FAILED|expected|Exception|What went wrong" -A2 test.log | head -40 | sed 's/^/::error::/'; exit 1; }
          grep -E "Russian ASR|cases identical|Pronunciation:|Voice|Numbers:" test.log | sed 's/^/::notice::/' || true

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|warning: \[|FAILED|What went wrong|Could not" -A3 build.log | head -60 | sed 's/^/::error::/'; exit 1; }

      - name: Check APK contents
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/.*\.so"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for lib in libvosk.so libonnxruntime.so libsherpa-onnx-jni.so libjnidispatch.so; do
              unzip -l "$APK" | grep -q "lib/$abi/$lib" || { echo "::error::missing $lib for $abi"; exit 1; }
            done
          done
          unzip -l "$APK" | grep -q "assets/asr/ru-zipformer/encoder.int8.onnx" || { echo "::error::Russian speech model missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/learn/learn.json" || { echo "::error::learning data missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/tts/ru/model.onnx" || { echo "::error::voice missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/tts/ru/espeak-ng-data/ru_dict" || { echo "::error::voice dictionary missing"; exit 1; }
          unzip -l "$APK" | grep -q "assets/mt/en-ru/decoder.onnx" || { echo "models missing"; exit 1; }
          cp "$APK" FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTranslator-apk
          path: FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: app/src/main/assets
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: |
            libs/sherpa-onnx-jvm.jar
            app/src/main/jniLibs
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: testdata
          path: .model-cache/ru-zipformer/test.wav
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: refs
          path: build/ref
          retention-days: 3

  windows:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - uses: actions/download-artifact@v4
        with:
          name: testdata
          path: testdata

      - name: Build laptop app
        shell: bash
        run: |
          pip install -r laptop/requirements.txt pyinstaller==6.11.1
          # console build with the console hidden at start: no black window for the user,
          # but stdout/stderr still work for the CI self-test
          pyinstaller --noconfirm --console --hide-console hide-early --name FieldTranslator \
            --collect-all vosk --collect-all sounddevice --collect-all sherpa_onnx --collect-binaries onnxruntime \
            --paths laptop laptop/app.py
          cp -r models dist/FieldTranslator/models
          rm -f dist/FieldTranslator/models/models_size.txt
          cp laptop/README-laptop.txt dist/FieldTranslator/README.txt

      - name: Self-test the built app
        shell: pwsh
        timeout-minutes: 8
        run: |
          cd dist/FieldTranslator
          $wav = (Resolve-Path ..\..\testdata\test.wav).Path
          $p = Start-Process -FilePath .\FieldTranslator.exe -ArgumentList '--selftest',"`"$wav`"" -PassThru -NoNewWindow `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "::error::self-test timed out" }
          $log = @()
          foreach ($f in 'selftest.txt','out.txt','err.txt') { if (Test-Path $f) { $log += Get-Content $f } }
          $log | ForEach-Object { Write-Output $_ }
          $passed = (Test-Path selftest.txt) -and (Select-String -Path selftest.txt -Pattern 'SELFTEST PASSED' -Quiet)
          Remove-Item selftest.txt,out.txt,err.txt -ErrorAction SilentlyContinue
          if (-not $passed) {
            $tail = ($log | Select-Object -Last 25) -join ' | '
            Write-Output "::error title=Windows self-test failed::$tail"
            exit 1
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/FieldTranslator -DestinationPath FieldTranslator-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTranslator-windows
          path: FieldTranslator-Windows.zip

  web:
    # iPhone / any-browser version, published on GitHub Pages; the same app is also packed into the Android APK
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      deploy: ${{ steps.webchanged.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the iPhone app change?
        id: webchanged
        run: |
          # compare with the build that is live on the iPhone site right now; republish only if the
          # iPhone app's own code or learning data changed since then
          live=$(curl -fsL https://beholdmeme.github.io/FieldTranslator/js/app.js | grep -o "APP_VERSION = '[^']*'" | grep -o -- '-[0-9a-f]*' | tr -d -)
          echo "live build: ${live:-unknown}"
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "live build unknown - will publish"
          elif git diff --name-only "$live" HEAD | grep -qE '^(web/|scripts/|laptop/pronounce.py|laptop/ru_numbers.py)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "iPhone app changed since $live - will publish"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::iPhone app unchanged - site not republished"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - uses: actions/download-artifact@v4
        with:
          name: testdata
          path: testdata

      - uses: actions/download-artifact@v4
        with:
          name: refs
          path: build/ref

      - name: Cached speech engine (WebAssembly)
        id: wasmcache
        uses: actions/cache/restore@v4
        with:
          path: sherpa-wasm
          key: sherpa-wasm-web-1.13.8-v1

      - name: Build speech engine for browsers (sherpa-onnx -> WebAssembly)
        if: steps.wasmcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ../emsdk
          ../emsdk/emsdk install 4.0.23
          ../emsdk/emsdk activate 4.0.23
          source ../emsdk/emsdk_env.sh
          git clone --depth 1 -b v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git ../sherpa-onnx
          cd ../sherpa-onnx
          # start small and grow as needed (phones can't always reserve 512 MB up front)
          sed -i 's/INITIAL_MEMORY=512MB/INITIAL_MEMORY=64MB/' wasm/wasm-common.cmake
          grep -q 'INITIAL_MEMORY=64MB' wasm/wasm-common.cmake
          sed -i 's/make -j3/make -j4/' build-wasm-simd-web.sh
          ./build-wasm-simd-web.sh > build.log 2>&1 || { tail -60 build.log | sed 's/^/::error::/'; exit 1; }
          mkdir -p $GITHUB_WORKSPACE/sherpa-wasm
          cp build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.* $GITHUB_WORKSPACE/sherpa-wasm/
          cp wasm/asr/sherpa-onnx-asr.js wasm/tts/sherpa-onnx-tts.js $GITHUB_WORKSPACE/sherpa-wasm/
          ls -la $GITHUB_WORKSPACE/sherpa-wasm

      - name: Save speech engine
        if: steps.wasmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sherpa-wasm
          key: sherpa-wasm-web-1.13.8-v1

      - name: Test tools
        working-directory: web/test
        run: |
          run() { "$@" > step.log 2>&1 || { tail -30 step.log | sed 's/^/::error::/'; exit 1; }; }
          run npm install --no-audit --no-fund
          run npx playwright install --with-deps chromium webkit
          run pip install pillow==11.0.0

      - name: Check the web code gives identical results (JavaScript)
        run: |
          set -o pipefail
          STRESS=models/learn/stress.tsv PRON_REF=build/ref/pron.tsv LEARN_JSON=models/learn/learn.json NUM_REF=build/ref/numbers.tsv \
            node web/test/node_test.js . "models/mt/ru-en::build/ref/ru-en.tsv" "models/mt/en-ru::build/ref/en-ru.tsv" 2>&1 | tee node.log
          grep -E "cases|Pronunciation|Numbers" node.log | sed 's/^/::notice::/' || true

      - name: Build web app
        run: |
          ls models models/* | head -30
          scripts/build_web.sh models sherpa-wasm web/test/node_modules/onnxruntime-web/dist site

      - name: Test in Chromium and WebKit (iPhone engine)
        working-directory: web/test
        timeout-minutes: 20
        run: |
          cp ../../testdata/test.wav ../../site/test/test.wav
          # both browsers at once
          node smoke.js ../../site chromium "$PWD/../../testdata/test.wav" > chromium.log 2>&1 & c=$!
          node smoke.js ../../site webkit "$PWD/../../testdata/test.wav" > webkit.log 2>&1 & w=$!
          ok=0; wait $c || ok=1; wait $w || ok=1
          cat chromium.log webkit.log
          exit $ok

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/test/shot-*.png
          retention-days: 7

      - name: Package site
        run: |
          rm -rf site/test
          du -sh site
          find site -size +95M -print | sed 's/^/::error::file too big for GitHub Pages: /' | grep . && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-pages-artifact@v3
        if: steps.webchanged.outputs.deploy == 'true'
        with:
          path: site

  apk:
    # Android: the same app as the iPhone version inside the APK (plus the classic app as a backup).
    # Separate from the iPhone site so a slow Android test can never hold up an iPhone update.
    needs: [android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - uses: actions/download-artifact@v4
        with:
          name: testdata
          path: testdata

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: .

      - name: Build Android app (full app inside)
        run: |
          set -o pipefail
          ls libs/sherpa-onnx-jvm.jar app/src/main/jniLibs/*/libsherpa-onnx-jni.so
          A=app/src/main/assets
          rm -rf "$A"; mkdir -p "$A"; cp -r models/. "$A/"
          mkdir -p "$A/web"
          # the big models are already in the APK for the classic app; the web app reads those same files
          rsync -a site/ "$A/web/" --exclude 'models/asr/ru-zipformer' --exclude 'models/mt' \
            --exclude 'models/tts' --exclude 'models/learn' --exclude '.nojekyll'
          mkdir -p "$A/web/test" && cp testdata/test.wav "$A/web/test/test.wav"
          du -sh "$A" "$A/web"
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee apk.log || {
            grep -E "error:|FAILED|What went wrong" -A3 apk.log | head -40 | sed 's/^/::error::/'; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk FieldTranslator.apk
          ls -la FieldTranslator.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the APK on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/android_selftest.sh FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTranslator-apk-full
          path: FieldTranslator.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: android-*.png
          retention-days: 7


  pages:
    needs: web
    if: needs.web.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [android, windows, apk]
    # publish the APK even if the laptop build fails
    if: always() && needs.android.result == 'success' && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          files="out/FieldTranslator-apk-full/FieldTranslator.apk"
          [ -f out/FieldTranslator-windows/FieldTranslator-Windows.zip ] && files="$files out/FieldTranslator-windows/FieldTranslator-Windows.zip"
          gh release create latest $files \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "Offline Russian <-> English translator plus a learn-to-read-Russian course: finish the Learn section and you can read basic Russian. Android: download FieldTranslator.apk on the phone and open it (allow 'install unknown apps') - same app as the iPhone version, fully offline. iPhone: open https://beholdmeme.github.io/FieldTranslator/ in Safari and Add to Home Screen. Laptop: unzip FieldTranslator-Windows.zip and run FieldTranslator.exe."
